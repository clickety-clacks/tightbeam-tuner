name: release-note-gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-note-gate:
    name: release-note-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test release-note and compatibility-hook rules
        run: python3 -m unittest discover -s ios/ci_scripts -p 'test_*.py' -v

      - name: Validate fresh author-written release note
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_DESCRIPTION: ${{ github.event.pull_request.body || '' }}
        run: |
          set -eu
          base_sha="$BASE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base_sha="$(git rev-parse "$GITHUB_SHA^1")"
          fi

          base_note="$(mktemp)"
          trap 'rm -f "$base_note"' EXIT
          git show "$base_sha:ios/TightbeamTuner/CurrentBuildReleaseNote.json" > "$base_note"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            export TUNER_PR_DESCRIPTION="$PR_DESCRIPTION"
            python3 ios/ci_scripts/release_notes.py premerge \
              --base-note "$base_note" \
              --require-pr-provenance
          else
            python3 ios/ci_scripts/release_notes.py premerge \
              --base-note "$base_note"
          fi

  compatibility-diagnostic:
    name: compatibility-diagnostic
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      CI_BUILD_ID: ${{ github.run_id }}
      CI_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_XCODE_SCHEME: TightbeamTuner
      CI_XCODEBUILD_ACTION: test
      CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record toolchain and simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Read the planned release build number
        run: |
          build_number="$(python3 -c 'import json; print(json.load(open("ios/TightbeamTuner/CurrentBuildReleaseNote.json", encoding="utf-8"))["build"])')"
          case "$build_number" in
            ''|*[!0-9]*) echo "current release note has no positive numeric build number" >&2; exit 1 ;;
          esac
          if [ "$build_number" -le 0 ]; then
            echo "current release note has no positive numeric build number" >&2
            exit 1
          fi
          echo "PLANNED_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Run non-distributing compatibility and detector matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export CI_DERIVED_DATA_PATH="$RUNNER_TEMP/TunerCompatibilityDerivedData"
          export CI_DIAGNOSTIC_ARTIFACTS_PATH="$RUNNER_TEMP/TunerCompatibilityDiagnostics"
          export REPORT_PATH="$RUNNER_TEMP/ReleaseCompatibilityReport.json"
          mkdir -p "$CI_DERIVED_DATA_PATH"
          mkdir -p "$CI_DIAGNOSTIC_ARTIFACTS_PATH"
          python3 ios/ci_scripts/compatibility_matrix.py \
            --diagnostic \
            --build-number "$PLANNED_BUILD_NUMBER" \
            --output "$REPORT_PATH"

      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuner-compatibility-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ReleaseCompatibilityReport.json
            ${{ runner.temp }}/TunerCompatibilityDiagnostics/
          if-no-files-found: error
          retention-days: 30
